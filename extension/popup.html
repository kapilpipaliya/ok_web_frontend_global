<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YSaar - YouTube Organizer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 500px;
      height: 600px;
      overflow: hidden;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      background: #fff;
      color: #333;
    }

    #loading.hidden {
      display: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #error {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 32px;
      text-align: center;
      background: #fff;
      color: #333;
    }

    #error.visible {
      display: flex;
    }

    #error h2 {
      font-size: 18px;
      margin-bottom: 12px;
      color: #e74c3c;
    }

    #error p {
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    #error button {
      padding: 10px 20px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    #error button:hover {
      background: #2980b9;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    iframe.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading YSaar...</p>
  </div>

  <div id="error">
    <h2>Not Signed In</h2>
    <p>Please sign in to YSaar first to use this extension.</p>
    <button id="openYsaar">Open YSaar</button>
  </div>

  <iframe id="app" allow="clipboard-write"></iframe>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
