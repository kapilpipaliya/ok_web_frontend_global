<style>
  .grid {
    display: grid;
    grid-template-rows: auto auto 1fr;
    height: 300px;
    border: 1px solid #ccc;
  }

  /* Row 1 (fixed - header) */
  .row1 {
    background: #eee;
    padding: 10px;
  }

  /* Row 2 (fixed but wide content) */
  .row2 {
    overflow-x: hidden; /* Hide scrollbar */
    background: #ddd;
    white-space: nowrap;
  }

  /* Row 3 (scrollable) */
  .row3 {
    overflow-x: auto;
    white-space: nowrap;
    background: #fafafa;
  }

  /* Common wide content */
  .wide {
    display: inline-block;
    width: 1500px;
    padding: 10px;
    border: 1px solid #aaa;
  }
</style>

<div class="grid">
  <div class="row1">Row 1 (Fixed Header)</div>

  <div id="row2" class="row2">
    <div class="wide">Row 2 (Follows horizontal scroll)</div>
  </div>

  <div id="row3" class="row3">
    <div class="wide">Row 3 (Horizontally scrollable)</div>
  </div>
</div>

<script>
  const row2 = document.getElementById('row2');
  const row3 = document.getElementById('row3');

  // Sync horizontal scroll
  row3.addEventListener('scroll', () => {
    row2.scrollLeft = row3.scrollLeft;
  });
</script>
